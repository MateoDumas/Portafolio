<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="8" fill="#0a0a0a" stroke="#00ffff" stroke-width="4"/>
  <text x="32" y="45" font-family="'Courier New', monospace" font-weight="bold" font-size="36" fill="#ff00ff" text-anchor="middle" filter="url(#glow)">CR</text>
  <rect x="8" y="8" width="48" height="48" rx="4" fill="none" stroke="#ff00ff" stroke-width="2" stroke-dasharray="4,4"/>
</svg>